[project]
name = "multi-tenant-rag-assistants"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahmoud-Matar", email = "mahmoud_gamal2001@aucegypt.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
multi-tenant-rag-assistants = "multi_tenant_rag_assistants:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
